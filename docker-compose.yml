version: "3.9"

services:
  # ============================================================================
  # FastAPI Stateless Backend Service
  # ============================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: iso_game_backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - HOST=0.0.0.0
      - DEBUG=True
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - game_network

  # ============================================================================
  # Contract Documentation Server (Swagger UI / Redoc)
  # ============================================================================
  docs:
    image: swaggerapi/swagger-ui:latest
    container_name: iso_game_swagger_docs
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      SWAGGER_JSON: /contracts/openapi.json
    volumes:
      - ./contracts:/contracts:ro
    networks:
      - game_network

networks:
  game_network:
    driver: bridge
